[package]
name = "airgap-keys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M2: key management & PKI for the air-gap pipeline (export/release keys, provisioning, sign/verify wrappers)"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
base64 = "0.22"
rand = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "airgap-keys"
path = "src/main.rs"
