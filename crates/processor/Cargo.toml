[package]
name = "airgap-processor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M3: Update Server core (online) — vendor catalog, download+verify, behavior gate, bundle signing, OUTBOUND reader, INBOUND writer"

[[bin]]
name = "airgap-processor"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
airgap-proto = { path = "../proto" }
airgap-contracts = { path = "../contracts" }
airgap-keys = { path = "../keys" }
airgap-sandbox = { path = "../sandbox" }
clap = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = "0.22"
tracing-subscriber = { workspace = true }
