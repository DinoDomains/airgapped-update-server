[workspace]
resolver = "2"
members = ["crates/proto", "crates/server", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
axum = { version = "0.7", features = ["http2", "json", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls", "rustls-pemfile"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
x509-parser = "0.16"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
argon2 = "0.5"
rand = "0.8"
tar = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
